<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
  <title>Bee GameFi Clicker</title>
  <script src="https://telegram.org"></script>
  <style>
    html, body { background: #111215 !important; margin: 0; padding: 0; min-height: 100vh; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
    body { background: radial-gradient(circle at center, #251c08 0%, #111215 100%) !important; background-image: radial-gradient(circle at center, rgba(243, 186, 47, 0.08) 0%, transparent 70%), linear-gradient(to right, rgba(243, 186, 47, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(243, 186, 47, 0.03) 1px, transparent 1px) !important; background-size: auto, 30px 30px, 30px 30px !important; display: flex; flex-direction: column; }
    .game-wrapper { max-width: 480px; margin: 0 auto; padding: 16px 16px 90px 16px; box-sizing: border-box; width: 100%; }
    .stats-header { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    .stat-box { flex: 1; background: #1f2022; border: 1.5px solid #f3ba2f; box-shadow: 0 0 10px rgba(243, 186, 47, 0.15); border-radius: 12px; padding: 8px 4px; text-align: center; }
    .stat-label { font-size: 10px; color: #8e9297; text-transform: uppercase; display: block; }
    .stat-value { font-size: 13px; font-weight: bold; color: #f3ba2f; }
    .balance-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px 0; }
    .coin-icon { font-size: 40px; filter: drop-shadow(0 0 10px #f3ba2f); }
    .balance-amount { font-size: 38px; font-weight: 900; }
    .rank-container { background: rgba(31, 32, 34, 0.9); border: 1px solid rgba(243, 186, 47, 0.3); border-radius: 12px; padding: 10px 14px; margin-bottom: 20px; }
    .rank-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    .rank-progress-bg { background: #141517; height: 10px; border-radius: 5px; overflow: hidden; border: 0.5px solid #3d3e42; }
    #rank-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff4d4d 0%, #ffcc00 50%, #2ecc71 100%); background-size: 400px 100%; box-shadow: 0 0 10px rgba(243, 186, 47, 0.5); transition: width 0.4s ease; }
    .character-container { display: flex; justify-content: center; align-items: center; margin: 20px 0; }
    .character-circle { width: 220px; height: 220px; background: radial-gradient(circle, #4a3b12 0%, #1c1d20 80%); border: 5px solid #f3ba2f; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px rgba(243,186,47,0.3); cursor: pointer; }
    .bee-emoji-fallback { font-size: 90px; }
    .energy-container { margin-bottom: 10px; }
    .energy-text { font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 6px; }
    .energy-bar-bg { background: #141517; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid #3d3e42; }
    #energy-bar-fill { background: linear-gradient(90deg, #2ecc71, #27ae60); height: 100%; transition: width 0.1s ease; }
    .game-tab-content { display: none; }
    .game-tab-content.active { display: block; }
    .mine-section, .referral-container { background: #1f2022; border: 1.5px solid #f3ba2f; border-radius: 18px; padding: 16px; margin-top: 10px; }
    .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card-item { background: #141517; border: 1px solid #3d3e42; border-radius: 12px; padding: 12px; text-align: center; }
    .buy-btn, .action-btn { background: linear-gradient(180deg, #f3ba2f, #ff9900); color: #000; font-weight: bold; border: none; border-radius: 10px; padding: 10px; width: 100%; cursor: pointer; margin-top: 8px; }
    .bottom-nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1f2022; border-top: 2px solid #f3ba2f; height: 70px; display: flex; justify-content: space-around; align-items: center; max-width: 480px; margin: 0 auto; z-index: 9999; }
    .nav-item { display: flex; flex-direction: column; align-items: center; background: transparent; border: none; color: #8e9297; cursor: pointer; font-size: 11px; }
    .nav-item.active { color: #f3ba2f; }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="stats-header">
      <div class="stat-box"><span class="stat-label">За тап</span><span class="stat-value" id="tap-profit-display">+1</span></div>
      <div class="stat-box"><span class="stat-label">Доход сот</span><span class="stat-value" id="profit-display">0</span></div>
      <div class="stat-box"><span class="stat-label">Сон (офлайн)</span><span class="stat-value" id="offline-profit-display">0/ч</span></div>
    </div>
    <div id="tab-click" class="game-tab-content active">
      <div class="character-container">
        <div class="character-circle" onclick="handleTap(event)">
          <div id="bee-emoji" class="bee-emoji-fallback">🐛</div>
        </div>
      </div>
      <div class="energy-container">
        <div class="energy-text">⚡ <span id="current-energy">1000</span> / <span id="max-energy">1000</span></div>
        <div class="energy-bar-bg"><div id="energy-bar-fill" style="width: 100%;"></div></div>
      </div>
    </div>

    <div id="tab-mine" class="game-tab-content">
      <div class="mine-section">
        <h3>Улучшение пчелиных сот 📊</h3>
        <div id="cards-container" class="cards-grid"></div>
      </div>
    </div>

    <div id="tab-boosts" class="game-tab-content">
      <div class="mine-section">
        <h3>Лаборатория улья (Бусты) ⚡</h3>
        <div class="cards-grid">
          <div class="card-item">
            <div>👆</div><div style="font-weight:bold; font-size:13px; margin:4px 0">Мульти-Тап</div>
            <div id="multitap-desc" style="font-size:11px; color:#8e9297; margin-bottom:6px;">Ур. 1</div>
            <button class="buy-btn" id="btn-cost-multitap" onclick="upgradeStat('multitap')">💰 200</button>
          </div>
          <div class="card-item">
            <div>🔋</div><div style="font-weight:bold; font-size:13px; margin:4px 0">Лимит энергии</div>
            <div id="energy-desc" style="font-size:11px; color:#8e9297; margin-bottom:6px;">Ур. 1</div>
            <button class="buy-btn" id="btn-cost-energy" onclick="upgradeStat('energy')">💰 300</button>
          </div>
          <div class="card-item" style="grid-column: span 2;">
            <div>💤</div><div style="font-weight:bold; font-size:14px; margin:4px 0">Авто-майнинг во сне</div>
            <div id="offline-desc" style="font-size:11px; color:#8e9297; margin-bottom:6px;">Ур. 1</div>
            <button class="buy-btn" id="btn-cost-offline" onclick="upgradeStat('offline')">💰 500</button>
          </div>
        </div>
      </div>
    </div>

    <div id="tab-friends" class="game-tab-content">
      <div class="referral-container">
        <h3>Пригласить друзей 👥</h3>
        <button id="invite-btn" class="action-btn">Пригласить пчелу 🐝</button>
        <button id="copy-btn" class="action-btn" style="background:#333; color:#fff; margin-top:5px;">Скопировать ссылку 📋</button>
        <h4>Ваш рой (<span id="ref-count">0</span>):</h4>
        <ul id="referrals-list"></ul>
      </div>
    </div>

    <div class="bottom-nav-bar">
      <button class="nav-item active" onclick="switchTab(event, 'tab-click')"><span>🐝</span>Клик</button>
      <button class="nav-item" onclick="switchTab(event, 'tab-mine')"><span>📊</span>Соты</button>
      <button class="nav-item" onclick="switchTab(event, 'tab-boosts')"><span>⚡</span>Бусты</button>
      <button class="nav-item" onclick="switchTab(event, 'tab-friends')"><span>👥</span>Друзья</button>
    </div>
  </div>
  <script>
    // Укажите точный юзернейм вашего бота из @BotFather без знака @
    const BOT_USERNAME = 'richmining_bot'; 

    let gameState = { energy: 1000, maxEnergy: 1000, multitapLevel: 1, energyLimitLevel: 1, offlineMiningLevel: 1, balance: 0, totalEarned: 0 };
    
    // Локальное хранилище для пчел на случай отсутствия связи с сервером
    let localPurchasedCards = {
      "worker_bee": 0,
      "advanced_comb": 0,
      "honey_press": 0
    };

    const LEVELS_CONFIG = [
      { level: 1, name: "Личинка в сотах", minCoins: 0, emoji: "🐛" },
      { level: 2, name: "Пчела-Рабочий", minCoins: 1500, emoji: "🐝" },
      { level: 3, name: "Пчела-Воин", minCoins: 10000, emoji: "🐝⚔️" },
      { level: 4, name: "Пчелиный Спецназ", minCoins: 50000, emoji: "🐝🥷" },
      { level: 5, name: "Королева Матка (CEO)", minCoins: 250000, emoji: "👑🐝" }
    ];

    const upgradeCards = [
      { id: "worker_bee", name: "Купить Пчелу-Сборщика", basePrice: 150, baseProfit: 8, icon: "🐝" },
      { id: "advanced_comb", name: "Золотые Соты", basePrice: 800, baseProfit: 40, icon: "🍯" },
      { id: "honey_press", name: "Пресс Нектара", basePrice: 4500, baseProfit: 250, icon: "⚙️" }
    ];

    function switchTab(event, tabId) {
      document.querySelectorAll('.game-tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function getTelegramUserData() {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
        return { telegramId: window.Telegram.WebApp.initDataUnsafe.user.id.toString() };
      }
      return { telegramId: "123456789" };
    }
    const activeUser = getTelegramUserData();

    // Полное восстановление энергии за 3 часа (3 часа = 10800 секунд)
    setInterval(() => {
      if (gameState.energy < gameState.maxEnergy) {
        const recoveryPerSecond = gameState.maxEnergy / 10800;
        gameState.energy = Math.min(gameState.maxEnergy, gameState.energy + recoveryPerSecond);
        updateEnergyUI();
      }
    }, 1000);

    function handleTap(event) {
      const cost = gameState.multitapLevel;
      if (gameState.energy >= cost) {
        gameState.energy -= cost; gameState.balance += cost; gameState.totalEarned += cost;
        document.getElementById('balance-display').innerText = gameState.balance;
        updateEnergyUI(); updatePlayerRank(gameState.totalEarned);
      }
    }

    function updateEnergyUI() {
      document.getElementById('current-energy').innerText = Math.floor(gameState.energy);
      document.getElementById('max-energy').innerText = gameState.maxEnergy;
      document.getElementById('energy-bar-fill').style.width = `${(gameState.energy / gameState.maxEnergy) * 100}%`;
      document.getElementById('multitap-desc').innerText = `Ур. ${gameState.multitapLevel} (+${gameState.multitapLevel} к клику)`;
      document.getElementById('btn-cost-multitap').innerText = `💰 ${gameState.multitapLevel * 200}`;
      document.getElementById('energy-desc').innerText = `Ур. ${gameState.energyLimitLevel} (${gameState.maxEnergy} макс)`;
      document.getElementById('btn-cost-energy').innerText = `💰 ${gameState.energyLimitLevel * 300}`;
      
      const currentOfflineProfit = (gameState.offlineMiningLevel - 1) * 50;
      document.getElementById('offline-desc').innerText = `Ур. ${gameState.offlineMiningLevel} (+${gameState.offlineMiningLevel * 50}/ч офлайн)`;
      document.getElementById('btn-cost-offline').innerText = `💰 ${gameState.offlineMiningLevel * 500}`;
      document.getElementById('offline-profit-display').innerText = `${currentOfflineProfit}/ч`;
    }

    // Исправлено: Генерация ссылки с помощью шаблонных строк
    document.getElementById('invite-btn').addEventListener('click', () => {
      const link = `https://t.me/{BOT_USERNAME}?start=ref${activeUser.telegramId}`;
      const text = `🐝 Собирай нектар и зарабатывай мёд в игре вместе со мной!`;
      const url = `https://t.me{encodeURIComponent(link)}&text=${encodeURIComponent(text)}`;
      if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.openTelegramLink(url);
      else window.open(url, '_blank');
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      const link = `https://t.me{BOT_USERNAME}?start=ref${activeUser.telegramId}`;
      navigator.clipboard.writeText(link).then(() => alert("Ссылка скопирована! 📋"));
    });

    function upgradeStat(type) {
      let cost = type === 'multitap' ? gameState.multitapLevel * 200 : type === 'energy' ? gameState.energyLimitLevel * 300 : gameState.offlineMiningLevel * 500;
      if (gameState.balance < cost) return alert("Не хватает мёда!");
      gameState.balance -= cost;
      if (type === 'multitap') gameState.multitapLevel += 1;
      else if (type === 'energy') { gameState.energyLimitLevel += 1; gameState.maxEnergy += 500; }
      else if (type === 'offline') gameState.offlineMiningLevel += 1;
      document.getElementById('balance-display').innerText = gameState.balance;
      document.getElementById('tap-profit-display').innerText = `+${gameState.multitapLevel}`;
      updateEnergyUI();
    }

    function updatePlayerRank(totalEarned) {
      let currentRank = LEVELS_CONFIG; let nextRank = null;
      for (let i = 0; i < LEVELS_CONFIG.length; i++) { if (totalEarned >= LEVELS_CONFIG[i].minCoins) { currentRank = LEVELS_CONFIG[i]; nextRank = LEVELS_CONFIG[i + 1] || null; } }
      document.getElementById('rank-name').innerText = currentRank.name;
      document.getElementById('rank-level').innerText = `Уровень ${currentRank.level}/5`;
      document.getElementById('bee-emoji').innerText = currentRank.emoji;
      const progressFill = document.getElementById('rank-progress-fill');
      if (nextRank) progressFill.style.width = `${((totalEarned - currentRank.minCoins) / (nextRank.minCoins - currentRank.minCoins)) * 100}%`;
      else progressFill.style.width = "100%";
    }

    function renderCards() {
      const container = document.getElementById('cards-container'); container.innerHTML = '';
      let currentTotalProfit = 0;
      
      upgradeCards.forEach(card => {
        const currentCount = localPurchasedCards[card.id] || 0;
        const currentPrice = Math.floor(card.basePrice * Math.pow(1.5, currentCount));
        const nextProfit = Math.floor(card.baseProfit * Math.pow(1.2, currentCount));
        
        currentTotalProfit += currentCount * card.baseProfit;
        
        const el = document.createElement('div'); el.className = 'card-item'; el.style.border = '1px solid rgba(243,186,47,0.2)';
        el.innerHTML = `<div style="font-size:24px">${card.icon}</div><div style="font-size:13px; font-weight:bold; margin:4px 0">${card.name}</div><div style="font-size:11px; color:#8e9297">Приобретено: <span style="color:#f3ba2f; font-weight:bold">${currentCount} шт.</span></div><div style="font-size:11px; color:#2ecc71; margin:4px 0">Доход: +${nextProfit} мёд/ч</div><button class="buy-btn" onclick="buyCard('${card.id}', ${currentPrice})">💰 ${currentPrice}</button>`;
        container.appendChild(el);
      });
      document.getElementById('profit-display').innerText = currentTotalProfit;
    }

    function buyCard(cardId, price) {
      if (gameState.balance < price) return alert("Не хватает мёда!");
      gameState.balance -= price; 
      localPurchasedCards[cardId] = (localPurchasedCards[cardId] || 0) + 1;
      document.getElementById('balance-display').innerText = gameState.balance;
      alert("Успешно приобретено!"); 
      renderCards();
    }

    async function fetchSync() {
      try {
        const response = await fetch('https://onrender.com', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ telegramId: activeUser.telegramId }) });
        const data = await response.json();
        if (data.success && data.user) {
          gameState.balance = data.user.balance; gameState.maxEnergy = data.user.maxEnergy || 1000; gameState.multitapLevel = data.user.multitapLevel || 1; gameState.energyLimitLevel = data.user.energyLimitLevel || 1; gameState.offlineMiningLevel = data.user.offlineMiningLevel || 1; gameState.totalEarned = data.user.totalEarned || 0;
          if(data.user.purchasedCards && data.user.purchasedCards.length > 0) {
            data.user.purchasedCards.forEach(c => { localPurchasedCards[c.cardId] = c.level; });
          }
          document.getElementById('balance-display').innerText = gameState.balance; updateEnergyUI(); updatePlayerRank(gameState.totalEarned);
        }
      } catch (e) { updatePlayerRank(0); updateEnergyUI(); }
      renderCards();
    }
    document.addEventListener("DOMContentLoaded", () => { fetchSync(); });
  </script>
</body>
</html>
