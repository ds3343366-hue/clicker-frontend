<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
  <title>Bee Hive GameFi Clicker</title>
  <script src="https://telegram.org"></script>
  
  <style>
    /* ИСПРАВЛЕНО: Принудительный темный GameFi фон, который никогда не станет белым */
    html, body {
      background: #111215 !important;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #251c08 0%, #111215 100%) !important;
      background-image: radial-gradient(circle at center, rgba(243, 186, 47, 0.08) 0%, transparent 70%),
                        linear-gradient(to right, rgba(243, 186, 47, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(243, 186, 47, 0.03) 1px, transparent 1px) !important;
      background-size: auto, 30px 30px, 30px 30px !important;
      display: flex;
      flex-direction: column;
    }

    .game-wrapper {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px 90px 16px;
      box-sizing: border-box;
      width: 100%;
    }

    .stats-header { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .stat-box { flex: 1; background: #1f2022; border: 1.5px solid #f3ba2f; box-shadow: 0 0 10px rgba(243, 186, 47, 0.15); border-radius: 14px; padding: 10px; text-align: center; }
    .stat-label { font-size: 11px; color: #8e9297; text-transform: uppercase; display: block; }
    .stat-value { font-size: 15px; font-weight: bold; color: #f3ba2f; }

    .balance-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px 0; }
    .coin-icon { font-size: 40px; filter: drop-shadow(0 0 10px #f3ba2f); }
    .balance-amount { font-size: 38px; font-weight: 900; }

    /* РАНГИ И ЛИГИ */
    .rank-container { background: rgba(31, 32, 34, 0.9); border: 1px solid rgba(243, 186, 47, 0.3); border-radius: 12px; padding: 10px 14px; margin-bottom: 20px; }
    .rank-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    
    .rank-progress-bg { background: #141517; height: 10px; border-radius: 5px; overflow: hidden; border: 0.5px solid #3d3e42; }
    
    /* ИСПРАВЛЕНО: Светофорный градиент шкалы опыта (Красный -> Желтый -> Зеленый) */
    #rank-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4d4d 0%, #ffcc00 50%, #2ecc71 100%);
      background-size: 400px 100%; /* Удерживает плавность цветов при заполнении */
      box-shadow: 0 0 10px rgba(243, 186, 47, 0.5);
      transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .character-container { display: flex; justify-content: center; align-items: center; margin: 20px 0; }
    .character-circle {
      width: 220px; height: 220px; background: radial-gradient(circle, #4a3b12 0%, #1c1d20 80%);
      border: 5px solid #f3ba2f; border-radius: 50%; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 0 30px rgba(243,186,47,0.3); cursor: pointer; position: relative;
    }
    
    /* Текстовый скин-эмодзи на случай, если картинка не прогрузилась */
    .bee-emoji-fallback { font-size: 90px; position: absolute; }

    .game-tab-content { display: none; }
    .game-tab-content.active { display: block; }
    .mine-section, .daily-rewards-container, .referral-container { background: #1f2022; border: 1.5px solid #f3ba2f; border-radius: 18px; padding: 16px; margin-top: 10px; }
    .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card-item, .day-box { background: #141517; border: 1px solid #3d3e42; border-radius: 12px; padding: 12px; text-align: center; }
    .buy-btn, .action-btn { background: linear-gradient(180deg, #f3ba2f, #ff9900); color: #000; font-weight: bold; border: none; border-radius: 10px; padding: 10px; width: 100%; cursor: pointer; margin-top: 8px; }

    .bottom-nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1f2022; border-top: 2px solid #f3ba2f; height: 70px; display: flex; justify-content: space-around; align-items: center; max-width: 480px; margin: 0 auto; z-index: 9999; }
    .nav-item { display: flex; flex-direction: column; align-items: center; background: transparent; border: none; color: #8e9297; cursor: pointer; font-size: 11px; }
    .nav-item.active { color: #f3ba2f; }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="stats-header">
      <div class="stat-box"><span class="stat-label">За тап</span><span class="stat-value" id="tap-profit-display">+1</span></div>
      <div class="stat-box"><span class="stat-label">В час</span><span class="stat-value" id="profit-display">0</span></div>
    </div>

    <div class="balance-container">
      <div class="coin-icon">🍯</div>
      <div class="balance-amount" id="balance-display">0</div>
    </div>

    <div class="rank-container">
      <div class="rank-header"><span id="rank-name">Личинка</span><span id="rank-level">Уровень 1/5</span></div>
      <div class="rank-progress-bg"><div id="rank-progress-fill"></div></div>
    </div>

    <!-- ТАБ 1: КЛИКЕР -->
    <div id="tab-click" class="game-tab-content active">
      <div class="character-container">
        <div class="character-circle" onclick="handleTap(event)">
          <!-- ИСПРАВЛЕНО: Эмодзи-заглушка вместо белого экрана, если картинки нет -->
          <div id="bee-emoji" class="bee-emoji-fallback">🐛</div>
        </div>
      </div>
      <div class="energy-container">
        <div class="energy-text">⚡ <span id="current-energy">1000</span> / <span id="max-energy">1000</span></div>
        <div class="energy-bar-bg"><div id="energy-bar-fill" style="width: 100%;"></div></div>
      </div>
    </div>

    <!-- ТАБ 2: СОТЫ -->
    <div id="tab-mine" class="game-tab-content">
      <div class="mine-section">
        <h3>Улучшение сот 📊</h3>
        <div id="cards-container" class="cards-grid"></div>
      </div>
    </div>

    <!-- ТАБ 3: БУСТЫ -->
    <div id="tab-boosts" class="game-tab-content">
      <div class="mine-section">
        <h3>Прокачка энергии ⚡</h3>
        <div class="cards-grid">
          <div class="card-item">
            <div>👆</div><div style="font-weight:bold; font-size:13px;">Мульти-Тап</div>
            <div id="multitap-desc" style="font-size:11px; color:#8e9297">Ур. 1</div>
            <button class="buy-btn" onclick="upgradeStat('multitap')">Прокачать</button>
          </div>
          <div class="card-item">
            <div>🔋</div><div style="font-weight:bold; font-size:13px;">Лимит энергии</div>
            <div id="energy-desc" style="font-size:11px; color:#8e9297">Ур. 1</div>
            <button class="buy-btn" onclick="upgradeStat('energy')">Прокачать</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ТАБ 4: ДРУЗЬЯ -->
    <div id="tab-friends" class="game-tab-content">
      <div class="referral-container">
        <h3>Пригласить друзей 👥</h3>
        <button id="invite-btn" class="action-btn">Пригласить пчелу 🐝</button>
        <button id="copy-btn" class="action-btn" style="background:#333; color:#fff; margin-top:5px;">Скопировать ссылку 📋</button>
        <h4>Ваш рой (<span id="ref-count">0</span>):</h4>
        <ul id="referrals-list"></ul>
      </div>
    </div>

    <div class="bottom-nav-bar">
      <button class="nav-item active" onclick="switchTab(event, 'tab-click')"><span>🐝</span>Клик</button>
      <button class="nav-item" onclick="switchTab(event, 'tab-mine')"><span>📊</span>Соты</button>
      <button class="nav-item" onclick="switchTab(event, 'tab-boosts')"><span>⚡</span>Бусты</button>
      <button class="nav-item" onclick="switchTab(event, 'tab-friends')"><span>👥</span>Друзья</button>
    </div>
  </div>
  <script>
    // ⚠️ ВНИМАНИЕ: Вставьте сюда точное имя (username) вашего бота из @BotFather без знака @
    const BOT_USERNAME = 'richmining_bot'; 

    let gameState = { energy: 1000, maxEnergy: 1000, multitapLevel: 1, energyLimitLevel: 1, balance: 0 };
    
    // Конфигурация эволюции пчелы: уровни, имена и текстовые скины (эмодзи)
    const LEVELS_CONFIG = [
      { level: 1, name: "Личинка в сотах", minCoins: 0, emoji: "🐛" },
      { level: 2, name: "Пчела-Рабочий", minCoins: 1500, emoji: "🐝" },
      { level: 3, name: "Пчела-Воин", minCoins: 10000, emoji: "🐝⚔️" },
      { level: 4, name: "Пчелиный Спецназ", minCoins: 50000, emoji: "🐝🥷" },
      { level: 5, name: "Королева Матка (CEO)", minCoins: 250000, emoji: "👑🐝" }
    ];

    function switchTab(event, tabId) {
      document.querySelectorAll('.game-tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function getTelegramUserData() {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
        const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
        return { telegramId: tgUser.id.toString(), username: tgUser.username || tgUser.first_name || "Игрок" };
      }
      return { telegramId: "123456789", username: "Test_Bee" };
    }
    const activeUser = getTelegramUserData();

    function handleTap(event) {
      const cost = gameState.multitapLevel;
      if (gameState.energy >= cost) {
        gameState.energy -= cost; gameState.balance += cost;
        document.getElementById('balance-display').innerText = gameState.balance;
        updateEnergyUI();
      }
    }

    function updateEnergyUI() {
      document.getElementById('current-energy').innerText = Math.floor(gameState.energy);
      document.getElementById('max-energy').innerText = gameState.maxEnergy;
      document.getElementById('energy-bar-fill').style.width = `${(gameState.energy / gameState.maxEnergy) * 100}%`;
      document.getElementById('multitap-desc').innerText = `Ур. ${gameState.multitapLevel} (${gameState.multitapLevel} мёд/тап)`;
      document.getElementById('energy-desc').innerText = `Ур. ${gameState.energyLimitLevel} (${gameState.maxEnergy} макс)`;
    }

    // ИСПРАВЛЕНО: Расчет светофорной шкалы опыта и эволюция текстовых скинов пчелы
    function updatePlayerRank(totalEarned) {
      let currentRank = LEVELS_CONFIG[0];
      let nextRank = null;

      for (let i = 0; i < LEVELS_CONFIG.length; i++) {
        if (totalEarned >= LEVELS_CONFIG[i].minCoins) {
          currentRank = LEVELS_CONFIG[i];
          nextRank = LEVELS_CONFIG[i + 1] || null;
        }
      }

      document.getElementById('rank-name').innerText = currentRank.name;
      document.getElementById('rank-level').innerText = `Уровень ${currentRank.level}/5`;
      
      // Мгновенная эволюция внешнего вида (скина) пчелы на экране
      document.getElementById('bee-emoji').innerText = currentRank.emoji;

      const progressFill = document.getElementById('rank-progress-fill');
      if (nextRank) {
        // Вычисляем процент прохождения текущего ранга
        const percent = ((totalEarned - currentRank.minCoins) / (nextRank.minCoins - currentRank.minCoins)) * 100;
        progressFill.style.width = `${percent}%`;
      } else {
        progressFill.style.width = "100%";
        document.getElementById('rank-level').innerText = `Макс. ранг 🎉`;
      }
    }

    // ИСПРАВЛЕНО: Формирование корректной реферальной ссылки для открытия внутри Telegram
    const refLink = `https://t.me{BOT_USERNAME}?start=ref${activeUser.telegramId}`;

    document.getElementById('invite-btn').addEventListener('click', () => {
      const shareText = `🐝 Стань частью моего пчелиного роя! Качай соты и зарабатывай мёд вместе со мной!`;
      const tgShareUrl = `https://t.me{encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`;
      
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.openTelegramLink(tgShareUrl);
      } else {
        window.open(tgShareUrl, '_blank');
      }
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(refLink).then(() => alert("Ссылка скопирована в буфер обмена! 📋"));
    });

    async function fetchSync() {
      try {
        const response = await fetch('https://onrender.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegramId: activeUser.telegramId })
        });
        const data = await response.json();
        if (data.success && data.user) {
          gameState.balance = data.user.balance;
          gameState.maxEnergy = data.user.maxEnergy || 1000;
          gameState.multitapLevel = data.user.multitapLevel || 1;
          gameState.energyLimitLevel = data.user.energyLimitLevel || 1;
          document.getElementById('balance-display').innerText = gameState.balance;
          updateEnergyUI();
          updatePlayerRank(data.user.totalEarned || 0);
        }
      } catch (e) {
        // Заглушка для тестов, если бэкенд выключен
        updatePlayerRank(5000); 
      }
    }

    document.addEventListener("DOMContentLoaded", () => { fetchSync(); });
  </script>
</body>
</html>
