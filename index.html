<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
  <title>Bee GameFi Hive Clicker</title>
  <script src="https://telegram.org"></script>
  <style>
    html, body { background: #0c0b09 !important; margin: 0; padding: 0; min-height: 100vh; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; overflow-x: hidden; }
    
    /* РЕАЛИСТИЧНЫЙ ФОН: Живой улей и пасека с летящими частицами-пчелами */
    body {
      background: linear-gradient(180deg, rgba(17, 14, 8, 0.9) 0%, rgba(12, 11, 9, 0.98) 100%), 
                  radial-gradient(circle at center, #2e2107 0%, #0c0b09 100%) !important;
      position: relative;
    }
    
    /* Эффект трехмерной структуры сот на заднем плане */
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='56' height='98' viewBox='0 0 56 98'%3E%3Cpath d='M28 2L2 17v30l26 15 26-15V17L2 17M28 51L2 66v30l26 15 26-15V66L28 51z' fill='none' stroke='%23f3ba2f' stroke-width='0.4' stroke-opacity='0.15'/%3E%3C/svg%3E");
      z-index: -1; pointer-events: none;
    }

    /* Анимированные пчелы, летящие по экрану пасеки */
    .dynamic-bg-particle {
      position: fixed; width: 6px; height: 4px; background: #f3ba2f; border-radius: 50%;
      box-shadow: 0 0 6px #ffcc00; pointer-events: none; z-index: -1; opacity: 0.6;
      animation: flyBee 12s infinite linear;
    }
    @keyframes flyBee {
      0% { transform: translate(-50px, 110vh) scale(0.5); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% { transform: translate(110vw, -50px) scale(1.2); opacity: 0; }
    }

    .game-wrapper { max-width: 480px; margin: 0 auto; padding: 16px 16px 90px 16px; box-sizing: border-box; width: 100%; }
    .stats-header { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    
    /* ЗОЛОТЫЕ НЕОНОВЫЕ РАМКИ СОТ */
    .stat-box { 
      flex: 1; background: rgba(31, 32, 36, 0.85); backdrop-filter: blur(8px);
      border: 1.5px solid #f3ba2f; box-shadow: 0 0 12px rgba(243, 186, 47, 0.25), inset 0 0 8px rgba(243, 186, 47, 0.1); 
      border-radius: 14px; padding: 8px 4px; text-align: center; 
    }
    .stat-label { font-size: 10px; color: #a1a5ab; text-transform: uppercase; display: block; font-weight: bold; }
    .stat-value { font-size: 14px; font-weight: bold; color: #f3ba2f; text-shadow: 0 0 4px rgba(243, 186, 47, 0.3); }
  </style>
</head>
  <style>
    .balance-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 15px 0; }
    .coin-icon { font-size: 42px; filter: drop-shadow(0 0 12px #f3ba2f); animation: float 3s ease-in-out infinite; }
    .balance-amount { font-size: 40px; font-weight: 900; color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.1); }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    .rank-container { background: rgba(26, 27, 30, 0.9); border: 1.5px solid rgba(243, 186, 47, 0.3); border-radius: 14px; padding: 10px 14px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    .rank-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    .rank-progress-bg { background: #0d0e10; height: 10px; border-radius: 6px; overflow: hidden; border: 1px solid #2d2e33; }
    #rank-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff4d4d 0%, #ffcc00 50%, #2ecc71 100%); transition: width 0.4s ease; box-shadow: 0 0 12px rgba(255, 204, 0, 0.6); }
    
    .character-container { display: flex; justify-content: center; align-items: center; margin: 25px 0; }
    .character-circle { width: 230px; height: 230px; background: radial-gradient(circle, #59430d 0%, #17181c 85%); border: 4px solid #f3ba2f; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 35px rgba(243, 186, 47, 0.45), inset 0 0 25px rgba(243, 186, 47, 0.2); cursor: pointer; transition: transform 0.05s ease; }
    .character-circle:active { transform: scale(0.96); }
    .bee-emoji-fallback { font-size: 95px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.7)); }
    
    .energy-container { margin-bottom: 10px; }
    .energy-text { font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 6px; color: #eef0f2; }
    .energy-bar-bg { background: #0d0e10; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid #2d2e33; }
    #energy-bar-fill { background: linear-gradient(90deg, #2ecc71, #27ae60); height: 100%; transition: width 0.1s linear; }
    
    .game-tab-content { display: none; }
    .game-tab-content.active { display: block; }
    
    .mine-section, .referral-container { background: rgba(31, 32, 36, 0.9); backdrop-filter: blur(10px); border: 1.5px solid #f3ba2f; box-shadow: 0 0 15px rgba(243, 186, 47, 0.2); border-radius: 18px; padding: 16px; margin-top: 10px; }
    .section-title { margin-top: 0; color: #f3ba2f; font-size: 18px; text-shadow: 0 0 8px rgba(243,186,47,0.3); }
    .section-desc { font-size: 12px; color: #8e9297; margin: -6px 0 14px 0; }
    
    .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card-item { background: #141518; border: 1px solid rgba(243, 186, 47, 0.25); border-radius: 14px; padding: 14px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    
    .buy-btn, .action-btn { background: linear-gradient(180deg, #f3ba2f, #ff9900); color: #050505; font-weight: 800; border: none; border-radius: 10px; padding: 11px; width: 100%; cursor: pointer; margin-top: 8px; }
    .bottom-nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #151619; border-top: 2px solid #f3ba2f; height: 72px; display: flex; justify-content: space-around; align-items: center; max-width: 480px; margin: 0 auto; z-index: 9999; box-shadow: 0 -5px 25px rgba(0,0,0,0.6); }
    .nav-item { display: flex; flex-direction: column; align-items: center; background: transparent; border: none; color: #8e9297; cursor: pointer; font-size: 11px; font-weight: bold; width: 22%; height: 100%; justify-content: center; }
    .nav-item span { font-size: 22px; margin-bottom: 2px; }
    .nav-item.active { color: #f3ba2f; text-shadow: 0 0 8px rgba(243,186,47,0.4); }
  </style>
</head>
<body>
  <div class="dynamic-bg-particle" style="left:15%; animation-delay:0s; animation-duration:14s;"></div>
  <div class="dynamic-bg-particle" style="left:65%; animation-delay:4s; animation-duration:12s;"></div>

  <div class="game-wrapper">
    <div class="stats-header">
      <div class="stat-box"><span class="stat-label">За тап</span><span class="stat-value" id="tap-profit-display">+1</span></div>
      <div class="stat-box"><span class="stat-label">Доход сот</span><span class="stat-value" id="profit-display">0</span></div>
      <div class="stat-box"><span class="stat-label">Пассив улья</span><span class="stat-value" id="offline-profit-display">0/ч</span></div>
    </div>

    <div class="balance-container">
      <div class="coin-icon">🍯</div>
      <div class="balance-amount" id="balance-display">0</div>
    </div>

    <div class="rank-container">
      <div class="rank-header"><span id="rank-name">Личинка в сотах</span><span id="rank-level">Уровень 1/5</span></div>
      <div class="rank-progress-bg"><div id="rank-progress-fill"></div></div>
    </div>

    <!-- ТАБЫ ИНТЕРФЕЙСА -->
    <div id="tab-click" class="game-tab-content active">
      <div class="character-container">
        <div class="character-circle" onclick="handleTap(event)"><div id="bee-emoji" class="bee-emoji-fallback">🐛</div></div>
      </div>
      <div class="energy-container">
        <div class="energy-text">⚡ <span id="current-energy">1000</span> / <span id="max-energy">1000</span></div>
        <div class="energy-bar-bg"><div id="energy-bar-fill" style="width: 100%;"></div></div>
      </div>
    </div>

    <div id="tab-mine" class="game-tab-content">
      <div class="mine-section">
        <h3 class="section-title">Развитие Бизнес-Сот 📊</h3>
        <div id="cards-container" class="cards-grid"></div>
      </div>
    </div>

    <div id="tab-boosts" class="game-tab-content">
      <div class="mine-section">
        <h3 class="section-title">Инженерия Улья ⚡</h3>
        <div class="cards-grid">
          <div class="card-item"><div>👆</div><div style="font-weight:bold; font-size:13px; margin:4px 0">Мульти-Тап</div><div id="multitap-desc" style="font-size:11px; color:#8e9297; margin-bottom:6px;">Ур. 1</div><button class="buy-btn" id="btn-cost-multitap" onclick="upgradeStat('multitap')">💰 200</button></div>
          <div class="card-item"><div>🔋</div><div style="font-weight:bold; font-size:13px; margin:4px 0">Лимит бака</div><div id="energy-desc" style="font-size:11px; color:#8e9297; margin-bottom:6px;">Ур. 1</div><button class="buy-btn" id="btn-cost-energy" onclick="upgradeStat('energy')">💰 300</button></div>
          <div class="card-item" style="grid-column: span 2;"><div>💤</div><div style="font-weight:bold; font-size:13px; margin:4px 0">Технология Сна</div><div id="offline-desc" style="font-size:11px; color:#8e9297; margin-bottom:6px;">Ур. 1</div><button class="buy-btn" id="btn-cost-offline" onclick="upgradeStat('offline')">💰 500</button></div>
        </div>
      </div>
    </div>

    <div id="tab-friends" class="game-tab-content">
      <div class="referral-container">
        <h3 class="section-title">Пригласить в Рой 👥</h3>
        <button id="invite-btn" class="action-btn">Пригласить пчелу 🐝</button>
        <button id="copy-btn" class="action-btn" style="background:#28292d; color:#fff; margin-top:6px; border:1px solid #444;">Скопировать ссылку 📋</button>
        <h4>Ваш рабочий рой (<span id="ref-count">0</span>):</h4>
        <ul id="referrals-list" style="padding-left:18px; font-size:13px; color:#a1a5ab;"></ul>
      </div>
    </div>

    <div class="bottom-nav-bar">
      <button class="nav-item active" onclick="switchTab(event, 'tab-click')"><span>🐝</span>Клик</button>
      <button class="nav-item" onclick="switchTab(event, 'tab-mine')"><span>📊</span>Соты</button>
      <button class="nav-item" onclick="switchTab(event, 'tab-boosts')"><span>⚡</span>Бусты</button>
      <button class="nav-item" onclick="switchTab(event, 'tab-friends')"><span>👥</span>Друзья</button>
    </div>
  </div>
  <!-- ==========================================
       ИГРОВАЯ ЛОГИКА (ВСТРОЕННЫЙ APP.JS)
       ========================================== -->
  <script>
    // ⚠️ Впишите имя вашего бота из @BotFather БЕЗ символа @
    const BOT_USERNAME = 'richmining_bot'; 

    let gameState = { energy: 1000, maxEnergy: 1000, multitapLevel: 1, energyLimitLevel: 1, offlineMiningLevel: 1, balance: 0, totalEarned: 0 };
    let localPurchasedCards = { "ceo_card": 0, "marketing_card": 0, "crypto_card": 0 };

    const LEVELS_CONFIG = [
      { level: 1, name: "Личинка в сотах", minCoins: 0, emoji: "🐛" },
      { level: 2, name: "Пчела-Рабочий", minCoins: 5000, emoji: "🐝" },
      { level: 3, name: "Пчела-Сборщик", minCoins: 25000, emoji: "🐝🍯" },
      { level: 4, name: "Охранник Улья", minCoins: 100000, emoji: "🐝⚔️" },
      { level: 5, name: "Королева Матка (CEO)", minCoins: 1000000, emoji: "👑🐝" }
    ];

    const upgradeCards = [
      { id: "ceo_card", name: "Нанять СЕО Пчелу", basePrice: 100, baseProfit: 10, icon: "🐝" },
      { id: "marketing_card", name: "Реклама в Telegram", basePrice: 500, baseProfit: 45, icon: "📣" },
      { id: "crypto_card", name: "Листинг нектара", basePrice: 2000, baseProfit: 200, icon: "🪙" }
    ];

    function switchTab(event, tabId) {
      document.querySelectorAll('.game-tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function getTelegramUserData() {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
        return { telegramId: window.Telegram.WebApp.initDataUnsafe.user.id.toString() };
      }
      return { telegramId: "123456789" };
    }
    const activeUser = getTelegramUserData();

    // РАСЧЕТ: Полное восстановление энергии занимает ровно 3 часа (10800 секунд)
    setInterval(() => {
      if (gameState.energy < gameState.maxEnergy) {
        const recoveryPerSecond = gameState.maxEnergy / 10800;
        gameState.energy = Math.min(gameState.maxEnergy, gameState.energy + recoveryPerSecond);
        updateEnergyUI();
      }
    }, 1000);

    function handleTap(event) {
      const cost = gameState.multitapLevel;
      if (gameState.energy >= cost) {
        gameState.energy -= cost; gameState.balance += cost; gameState.totalEarned += cost;
        document.getElementById('balance-display').innerText = Math.floor(gameState.balance);
        updateEnergyUI(); updatePlayerRank(gameState.totalEarned);
      }
    }
    function updateEnergyUI() {
      document.getElementById('current-energy').innerText = Math.floor(gameState.energy);
      document.getElementById('max-energy').innerText = gameState.maxEnergy;
      document.getElementById('energy-bar-fill').style.width = (gameState.energy / gameState.maxEnergy) * 100 + '%';
      
      document.getElementById('multitap-desc').innerText = 'Ур. ' + gameState.multitapLevel + ' (+' + gameState.multitapLevel + ' к клику)';
      document.getElementById('btn-cost-multitap').innerText = '💰 ' + (gameState.multitapLevel * 200);
      
      document.getElementById('energy-desc').innerText = 'Ур. ' + gameState.energyLimitLevel + ' (' + gameState.maxEnergy + ' макс)';
      document.getElementById('btn-cost-energy').innerText = '💰 ' + (gameState.energyLimitLevel * 300);
      
      const currentOfflineProfit = (gameState.offlineMiningLevel - 1) * 50;
      document.getElementById('offline-desc').innerText = 'Ур. ' + gameState.offlineMiningLevel + ' (+' + (gameState.offlineMiningLevel * 50) + '/ч офлайн)';
      document.getElementById('btn-cost-offline').innerText = '💰 ' + (gameState.offlineMiningLevel * 500);
      document.getElementById('offline-profit-display').innerText = currentOfflineProfit + '/ч';
    }

    // НАТИВНЫЙ ДИАЛОГ ВЫБОРА КОНТАКТОВ В TELEGRAM ДЛЯ ПРИГЛАШЕНИЙ
    document.getElementById('invite-btn').addEventListener('click', function() {
      const shareUrl = 'https://t.me' + /richmining_bot/ + '?start=ref' + activeUser.telegramId;
      const textMessage = '🚀 Собирай нектар в Tap Game вместе со мной! Развивай пчелиный улей и получай бонус!';
      const fullLink = 'https://t.meshare/url?url=' + encodeURIComponent(shareUrl) + '&text=' + encodeURIComponent(textMessage);
      
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.openTelegramLink(fullLink);
      } else {
        window.open(fullLink, '_blank');
      }
    });

    document.getElementById('copy-btn').addEventListener('click', function() {
      const shareUrl = 'https://t.me' + /richmining_bot/ + '?start=ref' + activeUser.telegramId;
      navigator.clipboard.writeText(shareUrl).then(function() { alert("Ссылка скопирована в буфер! 📋"); });
    });

        async function upgradeStat(type) {
      let cost = type === 'multitap' ? gameState.multitapLevel * 200 : type === 'energy' ? gameState.energyLimitLevel * 300 : gameState.offlineMiningLevel * 500;
      if (gameState.balance < cost) return alert("Не хватает мёда в запасах!");

      try {
        // Отправляем запрос на бэкенд Render для сохранения в базу данных
        const response = await fetch('https://onrender.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegramId: activeUser.telegramId, type: type, cost: cost })
        });
        const data = await response.json();
        
        if (data.success && data.user) {
          // Обновляем состояние из базы данных
          gameState.balance = data.user.balance;
          gameState.multitapLevel = data.user.multitapLevel;
          gameState.maxEnergy = data.user.maxEnergy;
          gameState.energyLimitLevel = data.user.energyLimitLevel;
          gameState.offlineMiningLevel = data.user.dailyStreak || 1; // Достаем сохраненный стрик как уровень
          
          document.getElementById('balance-display').innerText = Math.floor(gameState.balance);
          document.getElementById('tap-profit-display').innerText = '+' + gameState.multitapLevel;
          updateEnergyUI();
          alert("Характеристика успешно улучшена и сохранена в MongoDB! 🐝");
        } else {
          alert("Ошибка при сохранении буста: " + data.error);
        }
      } catch (e) {
        // Резервное копирование, если сервер не ответил
        gameState.balance -= cost;
        if (type === 'multitap') gameState.multitapLevel += 1;
        else if (type === 'energy') { gameState.energyLimitLevel += 1; gameState.maxEnergy += 500; }
        else if (type === 'offline') gameState.offlineMiningLevel += 1;
        document.getElementById('balance-display').innerText = Math.floor(gameState.balance);
        document.getElementById('tap-profit-display').innerText = '+' + gameState.multitapLevel;
        updateEnergyUI();
      }
    }

    function updatePlayerRank(totalEarned) {
      let currentRank = LEVELS_CONFIG; let nextRank = null;
      for (let i = 0; i < LEVELS_CONFIG.length; i++) { if (totalEarned >= LEVELS_CONFIG[i].minCoins) { currentRank = LEVELS_CONFIG[i]; nextRank = LEVELS_CONFIG[i + 1] || null; } }
      document.getElementById('rank-name').innerText = currentRank.name;
      document.getElementById('rank-level').innerText = 'Уровень ' + currentRank.level + '/5';
      document.getElementById('bee-emoji').innerText = currentRank.emoji;
      const progressFill = document.getElementById('rank-progress-fill');
      if (nextRank) progressFill.style.width = ((totalEarned - currentRank.minCoins) / (nextRank.minCoins - currentRank.minCoins)) * 100 + '%';
      else progressFill.style.width = "100%";
    }

    function renderCards() {
      const container = document.getElementById('cards-container'); container.innerHTML = '';
      let currentTotalProfit = 0;
      
      upgradeCards.forEach(function(card) {
        const currentCount = localPurchasedCards[card.id] || 0;
        const currentPrice = Math.floor(card.basePrice * Math.pow(1.5, currentCount));
        const nextProfit = Math.floor(card.baseProfit * Math.pow(1.2, currentCount));
        currentTotalProfit += currentCount * card.baseProfit;
        
        const el = document.createElement('div'); el.className = 'card-item';
        el.innerHTML = '<div style="font-size:24px">' + card.icon + '</div><div style="font-size:13px; font-weight:bold; margin:4px 0">' + card.name + '</div><div style="font-size:11px; color:#8e9297">Куплено: <span style="color:#f3ba2f; font-weight:bold">' + currentCount + ' шт.</span></div><div style="font-size:11px; color:#2ecc71; margin:4px 0">Доход: +' + nextProfit + ' мёд/ч</div><button class="buy-btn" onclick="buyCard(\'' + card.id + '\', ' + currentPrice + ')">💰 ' + currentPrice + '</button>';
        container.appendChild(el);
      });
      document.getElementById('profit-display').innerText = currentTotalProfit;
    }

    async function buyCard(cardId, price) {
      if (gameState.balance < price) return alert("Не хватает мёда!");
      gameState.balance -= price; document.getElementById('balance-display').innerText = Math.floor(gameState.balance);
      try {
        const response = await fetch('https://aaaclickerbackend.onrender.com/', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegramId: activeUser.telegramId, cardId: cardId })
        });
        const data = await response.json();
        if (data.success && data.user) {
          gameState.balance = data.user.balance;
          document.getElementById('profit-display').innerText = data.user.profitPerHour;
          data.user.purchasedCards.forEach(function(c) { localPurchasedCards[c.cardId] = c.level; });
        }
      } catch (e) { localPurchasedCards[cardId] = (localPurchasedCards[cardId] || 0) + 1; }
      renderCards();
    }

    async function fetchSync() {
      try {
        const response = await fetch('https://aaaclickerbackend.onrender.com/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ telegramId: activeUser.telegramId }) });
        const data = await response.json();
        if (data.success && data.user) {
          gameState.balance = data.user.balance; gameState.maxEnergy = data.user.maxEnergy || 1000; gameState.multitapLevel = data.user.multitapLevel || 1; gameState.energyLimitLevel = data.user.energyLimitLevel || 1; gameState.offlineMiningLevel = data.user.offlineMiningLevel || 1; gameState.totalEarned = data.user.totalEarned || 0;
          if (data.user.purchasedCards && data.user.purchasedCards.length > 0) {
            data.user.purchasedCards.forEach(function(c) { localPurchasedCards[c.cardId] = c.level; });
          }
          document.getElementById('balance-display').innerText = Math.floor(gameState.balance); updateEnergyUI(); updatePlayerRank(gameState.totalEarned);
        }
      } catch (e) { updatePlayerRank(0); updateEnergyUI(); }
      renderCards();
    }

    document.addEventListener("DOMContentLoaded", function() { fetchSync(); });
  </script>
</body>
</html>
